<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>StudentFlow - Todo List Mahasiswa</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #e9f0fc 0%, #d9e4f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            max-width: 1400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(2px);
            border-radius: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .view {
            display: none;
            animation: fadeIn 0.35s ease;
        }

        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== LOGIN PAGE ========== */
        .login-wrapper {
            min-height: 650px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e2b3c, #0f2027);
            padding: 1.5rem;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 2rem 2rem 2.5rem;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .login-icon {
            font-size: 3rem;
            color: #2563eb;
            margin-bottom: 0.5rem;
        }

        .login-card h2 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            color: #0f2b3d;
            margin-bottom: 8px;
        }

        .login-sub {
            color: #4a627a;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .input-group {
            margin-bottom: 1.4rem;
            text-align: left;
        }

        .input-group label {
            font-weight: 600;
            color: #1e3a5f;
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        .input-group input,
        .input-group select,
        .input-group textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 28px;
            border: 1.5px solid #cfdfed;
            background: #fff;
            font-size: 0.95rem;
            transition: all 0.2s;
            outline: none;
        }

        .input-group textarea {
            border-radius: 20px;
            resize: vertical;
        }

        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .btn-primary {
            background: linear-gradient(98deg, #2563eb, #1d4ed8);
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .btn-primary:hover {
            background: linear-gradient(98deg, #1d4ed8, #1e3a8a);
            transform: scale(1.01);
        }

        .btn-secondary {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .error-msg {
            color: #dc2626;
            background: #fee2e2;
            border-radius: 30px;
            padding: 8px;
            font-size: 0.8rem;
            margin-top: 12px;
        }

        /* ========== HOME CONTAINER ========== */
        .home-container {
            background: #f8fafd;
        }

        .navbar {
            background: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo-area h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1f3b4c, #2b6e9e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo-area span {
            font-size: 0.8rem;
            color: #5b7c9c;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-badge {
            background: #eef2ff;
            border-radius: 40px;
            padding: 8px 18px;
            font-weight: 600;
            color: #1f4f8a;
        }

        .btn-logout {
            background: none;
            border: 1px solid #cbd5e1;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }

        .btn-logout:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }

        /* stats & filter */
        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding: 1.5rem 2rem;
            background: white;
            border-bottom: 1px solid #eef2ff;
            justify-content: space-between;
            align-items: center;
        }

        .stats-cards {
            display: flex;
            gap: 20px;
        }

        .stat-card {
            background: #f1f5f9;
            border-radius: 2rem;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
        }

        .filter-group {
            display: flex;
            gap: 10px;
        }

        .filter-btn {
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 30px;
            padding: 8px 18px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .filter-btn.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        /* Todo columns */
        .todo-main {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            padding: 2rem;
        }

        .todo-column {
            flex: 1;
            min-width: 300px;
            background: white;
            border-radius: 28px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03);
            overflow: hidden;
            border: 1px solid #e9edf2;
        }

        .column-header {
            background: #fbfdff;
            padding: 1rem 1.5rem;
            border-bottom: 2px solid #eef2ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .column-header h3 {
            font-weight: 700;
            font-size: 1.2rem;
        }

        .task-count {
            background: #eef2ff;
            border-radius: 40px;
            padding: 2px 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .tasks-list {
            min-height: 380px;
            max-height: 550px;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 40px 16px;
            font-size: 0.9rem;
        }

        .task-item {
            background: #ffffff;
            border-radius: 1.2rem;
            padding: 1rem;
            border: 1px solid #eef2ff;
            transition: 0.15s;
        }

        .task-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .priority-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 40px;
            background: #f1f5f9;
        }

        .task-desc {
            font-size: 0.8rem;
            color: #4b5563;
            margin-bottom: 12px;
            word-break: break-word;
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #6f8eae;
            margin-top: 8px;
        }

        .task-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            justify-content: flex-end;
        }

        .task-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .btn-complete {
            color: #10b981;
        }

        .btn-delete {
            color: #ef4444;
        }

        .btn-edit {
            color: #3b82f6;
        }

        /* FAB */
        .add-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #2563eb;
            width: 60px;
            height: 60px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            border: none;
            transition: transform 0.1s;
            z-index: 100;
        }

        .add-fab:hover {
            transform: scale(1.05);
            background: #1d4ed8;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 550px;
            border-radius: 2rem;
            animation: slideDown 0.2s ease;
            overflow: hidden;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 1.8rem;
            border-bottom: 1px solid #eef2ff;
        }

        .close-modal {
            font-size: 28px;
            cursor: pointer;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        #taskForm {
            padding: 1.5rem 1.8rem 1.8rem;
        }

        @media (max-width: 768px) {
            .stats-row {
                flex-direction: column;
                align-items: stretch;
            }

            .navbar {
                flex-direction: column;
                text-align: center;
            }

            .add-fab {
                bottom: 20px;
                right: 20px;
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
        }
    </style>

    <div class="app-container" id="appContainer">
        <!-- LOGIN VIEW -->
        <div id="loginView" class="view login-view active">
            <div class="login-wrapper">
                <div class="login-card">
                    <div class="login-icon">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <h2>StudentFlow</h2>
                    <p class="login-sub">Manajemen Tugas untuk Mahasiswa Pintar</p>

                    <form id="loginForm">
                        <div class="input-group">
                            <label><i class="fas fa-envelope"></i> Email Mahasiswa</label>
                            <input type="email" id="loginEmail" placeholder="contoh@student.ac.id" required>
                        </div>
                        <div class="input-group">
                            <label><i class="fas fa-lock"></i> Password</label>
                            <input type="password" id="loginPassword" placeholder="Minimal 4 karakter" required>
                        </div>
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-sign-in-alt"></i> Masuk Dashboard
                        </button>
                        <p class="demo-hint" style="font-size: 0.75rem; margin-top: 20px; color: #6c86a3;">
                            <i class="fas fa-info-circle"></i> Demo: gunakan email apapun & password minimal 4 karakter
                        </p>
                    </form>
                    <div id="loginError" class="error-msg" style="display: none;"></div>
                </div>
            </div>
        </div>

        <!-- HOME/APP VIEW -->
        <div id="homeView" class="view home-view">
            <div class="home-container">
                <!-- Navbar -->
                <nav class="navbar">
                    <div class="logo-area">
                        <h1><i class="fas fa-check-circle"></i> StudentFlow</h1>
                        <span>Todo List Mahasiswa</span>
                    </div>
                    <div class="user-info">
                        <div class="user-badge" id="userEmailDisplay">
                            <i class="fas fa-user-graduate"></i> <span id="currentUserEmail">user@example.com</span>
                        </div>
                        <button id="logoutBtn" class="btn-logout">
                            <i class="fas fa-sign-out-alt"></i> Keluar
                        </button>
                    </div>
                </nav>

                <!-- Stats & Filter -->
                <div class="stats-row">
                    <div class="stats-cards">
                        <div class="stat-card">
                            <i class="fas fa-tasks"></i>
                            <span id="totalTasksCount">0</span> Total
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-spinner"></i>
                            <span id="pendingTasksCount">0</span> Belum
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-check-circle"></i>
                            <span id="completedTasksCount">0</span> Selesai
                        </div>
                    </div>
                    <div class="filter-group">
                        <button class="filter-btn active" data-filter="all">Semua</button>
                        <button class="filter-btn" data-filter="pending">Belum</button>
                        <button class="filter-btn" data-filter="completed">Selesai</button>
                    </div>
                </div>

                <!-- Kolom To-Do (Belum & Selesai) -->
                <div class="todo-main">
                    <!-- Kolom Pending -->
                    <div class="todo-column">
                        <div class="column-header">
                            <h3><i class="fas fa-hourglass-half"></i> Belum Selesai</h3>
                            <span class="task-count" id="pendingColumnCount">0</span>
                        </div>
                        <div class="tasks-list" id="pendingTasksList">
                            <!-- Dynamic Pending Tasks -->
                            <div class="empty-state">Tidak ada tugas</div>
                        </div>
                    </div>

                    <!-- Kolom Completed -->
                    <div class="todo-column">
                        <div class="column-header">
                            <h3><i class="fas fa-check-double"></i> Selesai</h3>
                            <span class="task-count" id="completedColumnCount">0</span>
                        </div>
                        <div class="tasks-list" id="completedTasksList">
                            <div class="empty-state">Tugas selesai akan muncul disini</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- FAB Button Tambah Tugas -->
            <button id="addTaskFab" class="add-fab">
                <i class="fas fa-plus"></i>
            </button>
        </div>
    </div>

    <!-- MODAL untuk Tambah / Edit Tugas -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Tambah Tugas Baru</h3>
                <span class="close-modal">&times;</span>
            </div>
            <form id="taskForm">
                <input type="hidden" id="taskId" value="">
                <div class="input-group">
                    <label>Judul Tugas <span class="required">*</span></label>
                    <input type="text" id="taskTitle" placeholder="Contoh: Tugas AI, Presentasi, UTS" required>
                </div>
                <div class="input-group">
                    <label>Deskripsi (opsional)</label>
                    <textarea id="taskDesc" rows="3" placeholder="Detail tugas, deadline, catatan..."></textarea>
                </div>
                <div class="input-group">
                    <label>Mata Kuliah / Kategori</label>
                    <select id="taskCategory">
                        <option value="Umum">📚 Umum</option>
                        <option value="Pemrograman">💻 Pemrograman</option>
                        <option value="Matematika">📐 Matematika</option>
                        <option value="Bahasa">🌍 Bahasa</option>
                        <option value="Proyek">🚀 Proyek Akhir</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Prioritas</label>
                    <select id="taskPriority">
                        <option value="Rendah">🟢 Rendah</option>
                        <option value="Sedang" selected>🟡 Sedang</option>
                        <option value="Tinggi">🔴 Tinggi</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="button" id="cancelModalBtn" class="btn-secondary">Batal</button>
                    <button type="submit" class="btn-primary">Simpan Tugas</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Modules -->
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
